name: yogmaaya_VPS

on:
  workflow_dispatch:
    inputs:
      runner_number:
        description: "Unique runner number (1, 2, 3, ...)"
        required: true
        default: "1"
        type: string

jobs:
  vps:
    runs-on: ubuntu-latest

    steps:
      # 1. Connect to Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
          use-cache: true

      # 2. Set a unique hostname
      - name: Set yogmaaya hostname
        shell: bash
        env:
          RUNNER_NUMBER: ${{ inputs.runner_number }}
        run: |
          set -euo pipefail

          if ! [[ "$RUNNER_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Runner number must be a positive integer."
            exit 1
          fi

          HOSTNAME="yogmaaya_${RUNNER_NUMBER}"

          echo "Setting Linux hostname to $HOSTNAME"
          sudo hostnamectl set-hostname "$HOSTNAME" || \
            sudo hostname "$HOSTNAME"

          echo "Setting Tailscale hostname to $HOSTNAME"
          sudo tailscale set --hostname="$HOSTNAME"

          echo "Linux hostname: $(hostname)"
          echo "Requested Tailscale hostname: $HOSTNAME"

      # 3. Enable Tailscale SSH
      - name: Enable Tailscale SSH
        shell: bash
        run: |
          set -e
          sudo tailscale set --ssh
          echo "Tailscale SSH enabled."

      # 4. Verify and print connection details
      - name: Verify VPS
        shell: bash
        env:
          RUNNER_NUMBER: ${{ inputs.runner_number }}
        run: |
          set -euo pipefail

          HOSTNAME="yogmaaya_${RUNNER_NUMBER}"
          TS_IP="$(sudo tailscale ip -4)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IP unavailable."
            exit 1
          fi

          echo "Hostname: $HOSTNAME"
          echo "Linux hostname: $(hostname)"
          echo "Tailscale IPv4: $TS_IP"
          echo
          sudo tailscale status
          echo
          echo "SSH by IP:"
          echo "ssh runner@$TS_IP"
          echo
          echo "SSH by MagicDNS, if configured:"
          echo "ssh runner@$HOSTNAME"

      # 5. Keep runner alive for six hours
      - name: Keep alive
        shell: bash
        run: |
          set -e

          echo "Runner started: $(date)"
          echo "Keeping runner alive for 6 hours."
          sleep 21600
          echo "Runner finished: $(date)"
